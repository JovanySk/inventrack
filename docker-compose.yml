services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventario-app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://inventario:secret123@db:5432/inventario_db
      JWT_SECRET: ${JWT_SECRET:-super_secret_dev_key_only}
      # ─── Email SMTP (Hostinger) ───
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SENDER_NAME: ${SENDER_NAME:-InvenTrack}
      SENDER_EMAIL: ${SENDER_EMAIL:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-admin@empresa.com}
      APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped
    networks:
      - inventario-net

  db:
    image: postgres:16-alpine
    container_name: inventario-db
    environment:
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: inventario_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inventario-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inventario-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inventario.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - inventario-net

volumes:
  pgdata:
    driver: local

networks:
  inventario-net:
    driver: bridge